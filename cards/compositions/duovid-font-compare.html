<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Name-tag font compare</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin:0; padding:0; width:1920px; height:1080px; background:#171717; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; background:#171717; }
      .scene { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; gap:26px; padding:50px 90px; box-sizing:border-box; }
      .row { display:flex; align-items:center; gap:48px; }
      .lbl { font-family:Arial, sans-serif; font-weight:700; font-size:30px; color:#8fb6c9; width:340px; }
      .num { color:#2dcdff; }
      .samp { font-size:72px; color:#ffffff; -webkit-text-stroke:3px #2dcdff; paint-order:stroke fill; font-weight:900; line-height:1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="font-compare" data-width="1920" data-height="1080" data-start="0" data-duration="2">
      <div class="scene clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="row" style="font-family:'Anton', sans-serif;"><span class="lbl"><span class="num">1.</span> Anton</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
        <div class="row" style="font-family:'Bebas Neue', sans-serif;"><span class="lbl"><span class="num">2.</span> Bebas Neue</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
        <div class="row" style="font-family:'Oswald', sans-serif;"><span class="lbl"><span class="num">3.</span> Oswald</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
        <div class="row" style="font-family:'Montserrat', sans-serif;"><span class="lbl"><span class="num">4.</span> Montserrat</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
        <div class="row" style="font-family:'Archivo Black', sans-serif;"><span class="lbl"><span class="num">5.</span> Archivo Black</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
        <div class="row" style="font-family:'Teko', sans-serif;"><span class="lbl"><span class="num">6.</span> Teko</span><span class="samp">CJ&nbsp;&nbsp;&nbsp;Jared</span></div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        window.__timelines["font-compare"] = gsap.timeline({ paused: true });
      </script>
    </div>
  </body>
</html>
