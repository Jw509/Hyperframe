<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cbb-el-recap</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin:0; padding:0; width:1200px; height:1400px; background:transparent; overflow:hidden; font-family:"Helvetica Neue","Helvetica",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
      #root { position:relative; width:1200px; height:1400px; }

      .recap-card { position:absolute; left:50%; top:50%; width:840px; padding:60px 68px 68px; border-radius:56px;
        background:rgba(255,255,255,0.08); backdrop-filter:blur(56px) saturate(140%); -webkit-backdrop-filter:blur(56px) saturate(140%);
        border:2px solid rgba(255,255,255,0.18); box-shadow:0 28px 72px rgba(0,0,0,0.35),inset 0 2px 0 rgba(255,255,255,0.22);
        display:flex; flex-direction:column; align-items:center; opacity:0; }
      .recap-card__label { font-size:34px; font-weight:600; letter-spacing:12px; color:rgba(255,255,255,0.7); text-transform:uppercase; margin-bottom:8px; }
      .recap-card__value { font-size:116px; font-weight:800; color:#fff; line-height:1; letter-spacing:-4px; margin-bottom:40px; text-shadow:0 4px 24px rgba(0,0,0,0.45); font-variant-numeric:tabular-nums; }
      .recap-card__divider { width:70%; height:2px; background:rgba(255,255,255,0.18); margin:0 0 40px; }
      .recap-card__profit-label { font-size:36px; font-weight:700; letter-spacing:16px; color:#fff; text-transform:uppercase; margin-bottom:12px; text-shadow:0 2px 16px rgba(0,0,0,0.5); }
      .recap-card__profit { font-size:192px; font-weight:900; line-height:1; letter-spacing:-6px; font-variant-numeric:tabular-nums; }
      .recap-card__roi { font-size:60px; font-weight:700; letter-spacing:2px; margin-top:28px; font-variant-numeric:tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cbb-el-recap" data-width="1200" data-height="1400" data-start="0" data-duration="6.7">
      <div id="recap-card" class="recap-card clip" data-start="0" data-duration="6.7" data-track-index="91">
        <div class="recap-card__label">Box cost</div>
        <div class="recap-card__value">$29.99</div>
        <div class="recap-card__divider"></div>
        <div class="recap-card__label">Cards value</div>
        <div class="recap-card__value" id="recap-total">$0.00</div>
        <div class="recap-card__divider"></div>
        <div class="recap-card__profit-label" id="recap-profit-label">Profit</div>
        <div class="recap-card__profit" id="recap-profit">+$0.00</div>
        <div class="recap-card__roi" id="recap-roi"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused:true });

          const recap=document.getElementById("recap-card");
          const rTot=document.getElementById("recap-total");
          const rPro=document.getElementById("recap-profit");
          const rLab=document.getElementById("recap-profit-label");
          const rRoi=document.getElementById("recap-roi");
          const RS=0;
          const finalTotal=35.11; const profit=5.12; const isLoss=profit<0; const roi=17.0724;
          if(isLoss){ rPro.style.color="#f87171"; rPro.style.textShadow="0 8px 48px rgba(248,113,113,0.45)"; rLab.style.color="#f87171"; rLab.textContent="Loss"; rRoi.style.color="#f87171"; }
          else { rPro.style.color="#4ade80"; rPro.style.textShadow="0 8px 48px rgba(74,222,128,0.5)"; rRoi.style.color="#4ade80"; }
          gsap.set(recap,{xPercent:-50,yPercent:-50,transformOrigin:"center center"});
          gsap.set([rLab,rPro,rRoi],{opacity:0,y:32});
          tl.fromTo(recap,{opacity:0,scale:0.88},{opacity:1,scale:1,duration:0.7,ease:"back.out(1.4)"},RS);
          const rts={value:0};
          tl.to(rts,{value:finalTotal,duration:1.4,ease:"power2.out",onUpdate:()=>{rTot.textContent="$"+rts.value.toFixed(2);}},RS+0.4);
          tl.to([rLab,rPro,rRoi],{opacity:1,y:0,duration:0.5,ease:"power3.out",stagger:0.08},RS+1.85);
          const rps={value:0};
          tl.to(rps,{value:profit,duration:1.2,ease:"power2.out",onUpdate:()=>{const v=rps.value;rPro.textContent=(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);}},RS+2.1);
          rRoi.textContent=(roi>=0?"+":"")+roi.toFixed(1)+"% ROI";
          window.__timelines=window.__timelines||{};
          window.__timelines["cbb-el-recap"]=tl;
        })();
      </script>
    </div>
  </body>
</html>
