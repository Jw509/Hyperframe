<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <title>Final Edit (Shorts) - Topps Signature Class Rattleshort (4K)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin:0; padding:0; width:2160px; height:3840px; background:#000; overflow:hidden; font-family:"Helvetica Neue","Helvetica",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
      #root { position:relative; width:2160px; height:3840px; }
      #source-video { position:absolute; inset:0; width:2160px; height:3840px; object-fit:cover; object-position:center center; }

      .sale-card { position:absolute; right:240px; top:350px; width:460px; padding:18px 18px 8px; border-radius:40px;
        background:rgba(255,255,255,0.10); backdrop-filter:blur(48px) saturate(140%); -webkit-backdrop-filter:blur(48px) saturate(140%);
        border:2px solid rgba(255,255,255,0.20); box-shadow:0 24px 56px rgba(0,0,0,0.32),inset 0 2px 0 rgba(255,255,255,0.24);
        display:flex; flex-direction:column; align-items:stretch; opacity:0; }
      .sale-card__comp { width:100%; border-radius:26px; overflow:hidden; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,0.22); display:block; }
      .sale-card__comp img { width:100%; height:auto; display:block; }
      .sale-card__label { font-size:30px; font-weight:700; letter-spacing:6px; color:#ffd24a; text-transform:uppercase; text-align:center; margin-top:16px; text-shadow:0 2px 14px rgba(0,0,0,0.6); }
      .sale-card__value { font-size:100px; font-weight:800; color:#fff; line-height:1; letter-spacing:-4px; text-align:center; margin-top:16px; text-shadow:0 4px 24px rgba(0,0,0,0.5); }
      .sale-card__label + .sale-card__value { margin-top:4px; }
      .sale-card[data-money-shot="true"] .sale-card__value { color:#ffd24a; text-shadow:0 4px 32px rgba(255,210,74,0.6); }

      .box-tracker { position:absolute; left:72px; top:664px; width:424px; padding:28px 32px; border-radius:44px;
        background:rgba(255,255,255,0.08); backdrop-filter:blur(56px) saturate(140%); -webkit-backdrop-filter:blur(56px) saturate(140%);
        border:2px solid rgba(255,255,255,0.18); box-shadow:0 20px 48px rgba(0,0,0,0.28),inset 0 2px 0 rgba(255,255,255,0.22); opacity:0; }
      .box-tracker__label { font-size:24px; font-weight:600; letter-spacing:8px; color:rgba(255,255,255,0.7); text-transform:uppercase; margin-bottom:8px; line-height:1.25; }
      .box-tracker__value { font-size:64px; font-weight:800; letter-spacing:-2px; line-height:1; text-shadow:0 2px 16px rgba(0,0,0,0.5); font-variant-numeric:tabular-nums; }
      .box-tracker__value--cost { color:#f87171; }
      .box-tracker__value--total { color:#4ade80; }
      .box-tracker__divider { height:2px; background:rgba(255,255,255,0.15); margin:20px 0; }

      .recap-card { position:absolute; left:50%; top:50%; width:840px; padding:60px 68px 68px; border-radius:56px;
        background:rgba(255,255,255,0.08); backdrop-filter:blur(56px) saturate(140%); -webkit-backdrop-filter:blur(56px) saturate(140%);
        border:2px solid rgba(255,255,255,0.18); box-shadow:0 28px 72px rgba(0,0,0,0.35),inset 0 2px 0 rgba(255,255,255,0.22);
        display:flex; flex-direction:column; align-items:center; opacity:0; }
      .recap-card__label { font-size:34px; font-weight:600; letter-spacing:12px; color:rgba(255,255,255,0.7); text-transform:uppercase; margin-bottom:8px; }
      .recap-card__value { font-size:116px; font-weight:800; color:#fff; line-height:1; letter-spacing:-4px; margin-bottom:40px; text-shadow:0 4px 24px rgba(0,0,0,0.45); font-variant-numeric:tabular-nums; }
      .recap-card__divider { width:70%; height:2px; background:rgba(255,255,255,0.18); margin:0 0 40px; }
      .recap-card__profit-label { font-size:36px; font-weight:700; letter-spacing:16px; color:#fff; text-transform:uppercase; margin-bottom:12px; text-shadow:0 2px 16px rgba(0,0,0,0.5); }
      .recap-card__profit { font-size:192px; font-weight:900; line-height:1; letter-spacing:-6px; font-variant-numeric:tabular-nums; }
      .recap-card__roi { font-size:60px; font-weight:700; letter-spacing:2px; margin-top:28px; font-variant-numeric:tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="final-rattleshort" data-width="2160" data-height="3840" data-start="0" data-duration="88.77">
      <video id="source-video" class="clip" data-start="0" data-duration="82.07" data-track-index="0" muted playsinline src="../sources/rattleshort/Rattleshort.mp4"></video>

      <div id="chip-tyreek" class="sale-card clip" data-start="19.12" data-duration="2.78" data-track-index="1" data-value="5">
        <div class="sale-card__comp"><img src="../comps/rattleshort/01-tyreek-hill.png" alt="Tyreek Hill /275 $5.00" crossorigin="anonymous" /></div>
        <div class="sale-card__label">Closest comp</div>
        <div class="sale-card__value">$5.00</div>
      </div>
      <div id="chip-nico" class="sale-card clip" data-start="22.32" data-duration="1.1" data-track-index="2" data-value="2.25">
        <div class="sale-card__comp"><img src="../comps/rattleshort/02-nico-collins.png" alt="Nico Collins Class Icons $2.25" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$2.25</div>
      </div>
      <div id="chip-fannin" class="sale-card clip" data-start="23.82" data-duration="1.1" data-track-index="3" data-value="3.25">
        <div class="sale-card__comp"><img src="../comps/rattleshort/03-harold-fannin.png" alt="Harold Fannin Jr Green & Purple RC $3.25" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$3.25</div>
      </div>
      <div id="chip-conerly" class="sale-card clip" data-start="32.22" data-duration="1.1" data-track-index="4" data-value="1.29">
        <div class="sale-card__comp"><img src="../comps/rattleshort/04-josh-conerly.png" alt="Josh Conerly Jr RC $1.29" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$1.29</div>
      </div>
      <div id="chip-lawrence" class="sale-card clip" data-start="40.97" data-duration="1.43" data-track-index="5" data-value="1.99">
        <div class="sale-card__comp"><img src="../comps/rattleshort/05-trevor-lawrence.png" alt="Trevor Lawrence In Session $1.99" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$1.99</div>
      </div>
      <div id="chip-paramount" class="sale-card clip" data-start="53.12" data-duration="1.1" data-track-index="6" data-value="2.5">
        <div class="sale-card__comp"><img src="../comps/rattleshort/06-paramount-pairings.png" alt="49ers Paramount Pairings /175 $2.50" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$2.50</div>
      </div>
      <div id="chip-njoku" class="sale-card clip" data-start="54.52" data-duration="1.1" data-track-index="7" data-value="1">
        <div class="sale-card__comp"><img src="../comps/rattleshort/07-david-njoku.png" alt="David Njoku  $1.00" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$1.00</div>
      </div>
      <div id="chip-ratledge" class="sale-card clip" data-start="62.62" data-duration="3" data-track-index="8" data-value="15" data-money-shot="true">
        <div class="sale-card__comp"><img src="../comps/rattleshort/08-tate-ratledge.png" alt="Tate Ratledge Auto RC /225 $15.00" crossorigin="anonymous" /></div>
        <div class="sale-card__label">Closest comp</div>
        <div class="sale-card__value">$15.00</div>
      </div>
      <div id="chip-jsn" class="sale-card clip" data-start="67.82" data-duration="1.58" data-track-index="9" data-value="1.5">
        <div class="sale-card__comp"><img src="../comps/rattleshort/09-jaxon-smith-njigba.png" alt="Jaxon Smith-Njigba  $1.50" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$1.50</div>
      </div>
      <div id="chip-breece" class="sale-card clip" data-start="78.52" data-duration="1.06" data-track-index="10" data-value="1.25">
        <div class="sale-card__comp"><img src="../comps/rattleshort/10-breece-hall.png" alt="Breece Hall Class Action $1.25" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$1.25</div>
      </div>
      <div id="chip-warren" class="sale-card clip" data-start="79.62" data-duration="1.1" data-track-index="11" data-value="0.99">
        <div class="sale-card__comp"><img src="../comps/rattleshort/11-tyler-warren.png" alt="Tyler Warren RC $0.99" crossorigin="anonymous" /></div>
        <div class="sale-card__value">$0.99</div>
      </div>

      <div id="box-tracker" class="box-tracker clip" data-start="15.00" data-duration="66.67" data-track-index="90">
        <div class="box-tracker__label">Box cost</div><div class="box-tracker__value box-tracker__value--cost">$29.99</div>
        <div class="box-tracker__divider"></div>
        <div class="box-tracker__label">Cards pulled<br>total</div><div class="box-tracker__value box-tracker__value--total" id="box-tracker-total">$0.00</div>
      </div>

      <div id="recap-card" class="recap-card clip" data-start="82.07" data-duration="6.70" data-track-index="91">
        <div class="recap-card__label">Box cost</div>
        <div class="recap-card__value">$29.99</div>
        <div class="recap-card__divider"></div>
        <div class="recap-card__label">Cards value</div>
        <div class="recap-card__value" id="recap-total">$0.00</div>
        <div class="recap-card__divider"></div>
        <div class="recap-card__profit-label" id="recap-profit-label">Profit</div>
        <div class="recap-card__profit" id="recap-profit">+$0.00</div>
        <div class="recap-card__roi" id="recap-roi"></div>
      </div>

      <script>
        (function () {
          const SCL=2;
          const IN_DUR=0.3, OUT_DUR=0.4, POP_IN=0.7;
          const tl = gsap.timeline({ paused:true });
          gsap.set(".sale-card.clip", { transformOrigin:"100% 0%" });
          document.querySelectorAll(".sale-card.clip").forEach((el)=>{
            const start=Number(el.getAttribute("data-start"));
            const dur=Number(el.getAttribute("data-duration"));
            const money=el.getAttribute("data-money-shot")==="true";
            const inD=money?POP_IN:IN_DUR;
            const hold=Math.max(0.2,dur-inD-OUT_DUR);
            if(money){ tl.fromTo(el,{scale:0.7,opacity:0},{scale:1,opacity:1,duration:POP_IN,ease:"back.out(1.4)",overwrite:"auto"},start); }
            else { tl.fromTo(el,{x:640,opacity:0},{x:0,opacity:1,duration:IN_DUR,ease:"power3.out",overwrite:"auto"},start); }
            tl.to(el,{x:640,opacity:0,duration:OUT_DUR,ease:"power2.in",overwrite:"auto"},start+inD+hold);
            tl.set(el,{opacity:0},start+inD+hold+OUT_DUR);
          });
          const tracker=document.getElementById("box-tracker");
          const totalEl=document.getElementById("box-tracker-total");
          tl.fromTo(tracker,{x:-100,opacity:0},{x:0,opacity:1,duration:0.6,ease:"power3.out"},15.00);
          const revs=Array.from(document.querySelectorAll(".sale-card.clip")).map(el=>({start:Number(el.getAttribute("data-start")),value:parseFloat(el.getAttribute("data-value"))||0})).sort((a,b)=>a.start-b.start);
          const cs={value:0}; let run=0;
          revs.forEach(({start,value})=>{ const nt=run+value; tl.to(cs,{value:nt,duration:0.6,ease:"power1.out",onUpdate:()=>{totalEl.textContent="$"+cs.value.toFixed(2);}},start); run=nt; });
          tl.to(tracker,{opacity:0,duration:0.4,ease:"power2.in"},81.67);
          tl.set(tracker,{opacity:0},82.07);

          const recap=document.getElementById("recap-card");
          const rTot=document.getElementById("recap-total");
          const rPro=document.getElementById("recap-profit");
          const rLab=document.getElementById("recap-profit-label");
          const rRoi=document.getElementById("recap-roi");
          const COST=29.99; const RS=82.07;
          const finalTotal=run; const profit=finalTotal-COST; const isLoss=profit<0; const roi=profit/COST*100;
          if(isLoss){ rPro.style.color="#f87171"; rPro.style.textShadow="0 "+(4*SCL)+"px "+(24*SCL)+"px rgba(248,113,113,0.45)"; rLab.style.color="#f87171"; rLab.textContent="Loss"; rRoi.style.color="#f87171"; }
          else { rPro.style.color="#4ade80"; rPro.style.textShadow="0 "+(4*SCL)+"px "+(24*SCL)+"px rgba(74,222,128,0.5)"; rRoi.style.color="#4ade80"; }
          gsap.set(recap,{xPercent:-50,yPercent:-50,transformOrigin:"center center"});
          gsap.set([rLab,rPro,rRoi],{opacity:0,y:32});
          tl.fromTo(recap,{opacity:0,scale:0.88},{opacity:1,scale:1,duration:0.7,ease:"back.out(1.4)"},RS);
          const rts={value:0};
          tl.to(rts,{value:finalTotal,duration:1.4,ease:"power2.out",onUpdate:()=>{rTot.textContent="$"+rts.value.toFixed(2);}},RS+0.4);
          tl.to([rLab,rPro,rRoi],{opacity:1,y:0,duration:0.5,ease:"power3.out",stagger:0.08},RS+1.85);
          const rps={value:0};
          tl.to(rps,{value:profit,duration:1.2,ease:"power2.out",onUpdate:()=>{const v=rps.value;rPro.textContent=(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);}},RS+2.1);
          rRoi.textContent=(roi>=0?"+":"")+roi.toFixed(1)+"% ROI";

          window.__timelines=window.__timelines||{};
          window.__timelines["final-rattleshort"]=tl;
        })();
      </script>
    </div>
  </body>
</html>
