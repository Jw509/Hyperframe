<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"name","type":"string","label":"Name","default":"CJ"},
  {"id":"cx","type":"number","label":"Center X (px @1080p)","default":62},
  {"id":"cy","type":"number","label":"Center Y (px @1080p)","default":182},
  {"id":"size","type":"number","label":"Font size px","default":30},
  {"id":"font","type":"string","label":"Font family","default":"Anton, sans-serif"}
]'>
  <head>
    <meta charset="UTF-8" />
    <title>DuoVid name tag</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin:0; padding:0; width:1920px; height:1080px; background:transparent; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; background:transparent; }

      /* centering shell — placed at (cx,cy), fades in/out as a group (no scaling) */
      #tag-pos { position:absolute; transform:translate(-50%,-50%); opacity:0; font-weight:900; letter-spacing:0.5px; line-height:1; white-space:nowrap; }

      /* blue glow layer (behind) — this is what pulses */
      #glow { position:absolute; left:0; top:0; color:#3dd8ff; filter:blur(8px) drop-shadow(0 0 5px #2dcdff); opacity:0; }
      /* the static white text with cyan outline (front, never changes size) */
      #tag  { position:relative; color:#ffffff; -webkit-text-stroke:2px #2dcdff; paint-order:stroke fill; text-shadow:0 1px 3px rgba(0,0,0,0.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="duovid-nametag" data-width="1920" data-height="1080" data-start="0" data-duration="5">
      <div id="tag-pos" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="glow"></div>
        <div id="tag"></div>
      </div>

      <script>
        (function () {
          const { name, cx, cy, size, font } = window.__hyperframes.getVariables();
          const pos = document.getElementById("tag-pos");
          const tag = document.getElementById("tag");
          const glow = document.getElementById("glow");
          tag.textContent = name;
          glow.textContent = name;
          pos.style.left = cx + "px";
          pos.style.top  = cy + "px";
          pos.style.fontSize = size + "px";
          pos.style.fontFamily = font;

          const tl = gsap.timeline({ paused: true });
          // entrance: fade in the group (no size change)
          tl.to(pos, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
          // GLOW BUILD: the blue glow slowly ramps from none up to full (= one pulse's
          // peak) across the whole 5s, reaching max right at the end. No pulsing, no fade-out.
          tl.to(glow, { opacity: 1.0, duration: 4.75, ease: "none" }, 0.15);

          window.__timelines = window.__timelines || {};
          window.__timelines["duovid-nametag"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
